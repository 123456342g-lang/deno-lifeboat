name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20: the CLI itself; the end-to-end run is skipped (no TypeScript type stripping).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed dist/src matches the sources
        run: |
          git status --porcelain -- dist/src
          test -z "$(git status --porcelain -- dist/src)" || { echo "::error::dist/src is stale: run npm run build and commit it"; exit 1; }

  install-from-github:
    name: npx from GitHub (npm ${{ matrix.npm }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        npm: ["9.2.0", "10"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - run: npm install -g npm@${{ matrix.npm }} && npm -v
      - name: scan a tiny Deno project via the tarball URL (the documented command)
        run: |
          mkdir app && cd app
          echo 'Deno.serve(() => new Response("hi"));' > main.ts
          npx --yes https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz scan . | tee out.txt
          grep -q "Auto-migratable" out.txt
      # npm 9's npx fails on every github: spec (an npm bug), so this form is only promised for npm >= 10.
      - name: scan via github:owner/repo
        if: matrix.npm != '9.2.0'
        run: |
          cd app
          npx --yes github:${{ github.repository }} scan . | tee out.txt
          grep -q "Auto-migratable" out.txt

  bun:
    name: Bun end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: node --test --test-name-pattern "Bun" dist/test/e2e.test.js
        env:
          LIFEBOAT_REQUIRE_BUN: "1"
      # A version-manager style wrapper (no exec) around bun: the suite must still exit.
      - name: e2e exits when bun is a wrapper script
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\n"%s" "$@"\n' "$(command -v bun)" > "$RUNNER_TEMP/shim/bun"
          chmod +x "$RUNNER_TEMP/shim/bun"
          PATH="$RUNNER_TEMP/shim:$PATH" timeout 120 node --test dist/test/e2e.test.js
        env:
          LIFEBOAT_REQUIRE_BUN: "1"
