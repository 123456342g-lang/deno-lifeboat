name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20: the CLI itself; the end-to-end run is skipped (no TypeScript type stripping).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed dist/src matches the sources
        run: |
          git status --porcelain -- dist/src
          test -z "$(git status --porcelain -- dist/src)" || { echo "::error::dist/src is stale: run npm run build and commit it"; exit 1; }

  install-from-github:
    name: npx from GitHub (npm ${{ matrix.npm }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm: ["9.2.0", "10"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - run: npm install -g npm@${{ matrix.npm }} && npm -v
      - name: scan a tiny Deno project
        run: |
          mkdir app && cd app
          echo 'Deno.serve(() => new Response("hi"));' > main.ts
          npx --yes github:${{ github.repository }}#${{ github.sha }} scan . | tee out.txt
          grep -q "Auto-migratable" out.txt

  bun:
    name: Bun end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: node --test --test-name-pattern "Bun" dist/test/e2e.test.js
        env:
          LIFEBOAT_REQUIRE_BUN: "1"
